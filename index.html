<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سوقك</title>
<meta name="description" content="سوقك: تسوّق من أسعار السوق اليومية وأكّد طلبك عبر واتساب.">
<meta name="theme-color" content="#1976D2">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Estedad:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#1976D2;--primary-d:#125DB0;--navy:#0A2C61;--gold:#FFC400;--bg:#f2f5fb;--card:#fff;--muted:#5d6b8c;--green:#1faa53;--line:#e4e9f3;--disp:'Estedad','Estedad','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Estedad','Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--navy);line-height:1.6;overflow-x:hidden;padding-bottom:78px}
button{font-family:inherit;cursor:pointer;border:none}
a{color:inherit;text-decoration:none}
.wrap{max-width:900px;margin:0 auto;padding:0 12px}
/* header */
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--primary),var(--navy));color:#fff;padding:10px 0 12px;box-shadow:0 4px 14px rgba(10,44,97,.25)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.logo{font-family:var(--disp);font-weight:800;font-size:1.7rem;line-height:1}
.logo small{display:block;font-family:'Estedad';font-weight:600;font-size:.68rem;opacity:.85;margin-top:3px}
.cart-btn{position:relative;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.cart-btn svg{width:24px;height:24px;fill:#fff}
.badge{position:absolute;top:-5px;left:-5px;min-width:21px;height:21px;padding:0 5px;border-radius:20px;background:var(--gold);color:var(--navy);font-weight:800;font-size:.78rem;display:none;align-items:center;justify-content:center}
.search{position:relative}
.search input{width:100%;height:46px;border:none;border-radius:12px;padding:0 44px 0 14px;font-family:inherit;font-size:1rem;color:var(--navy);outline:none}
.search svg{position:absolute;right:13px;top:12px;width:22px;height:22px;fill:var(--primary)}
.search .clr{position:absolute;left:8px;top:9px;width:28px;height:28px;border-radius:50%;background:#e8edf7;color:var(--navy);font-size:1rem;display:none}
function categoryIcon(name){return /صيدل|دواء/.test(name)?'pharmacy':/خضار|فاكه/.test(name)?'vegetables':/بوتيك|ملابس/.test(name)?'clothes':/جملة/.test(name)?'wholesale':'store'}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 6px;scrollbar-width:none;max-width:900px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;background:#fff;color:var(--navy);border:1.5px solid var(--line);border-radius:30px;padding:7px 16px;font-weight:700;font-size:.9rem;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .em{margin-left:5px}
/* promo */
.promo{margin:8px 12px 4px;background:linear-gradient(120deg,var(--gold),#ffd84d);color:var(--navy);border-radius:14px;padding:10px 14px;font-weight:800;font-family:var(--disp);display:flex;justify-content:space-between;align-items:center;max-width:876px}
.promo span{font-family:'Estedad';font-weight:600;font-size:.78rem;white-space:nowrap}.promo{gap:8px;font-size:.95rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:10px 4px 6px}
.sec h2{font-family:var(--disp);font-size:1.2rem;font-weight:800}
.sec .cnt{color:var(--muted);font-size:.82rem;font-weight:600}
/* grid */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;box-shadow:0 3px 12px rgba(10,44,97,.08);display:flex;flex-direction:column;position:relative}
.ph{position:relative;aspect-ratio:1/1;background:#eef2fa;display:block;width:100%;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:contain;display:block;opacity:0;transition:opacity .25s}
.ph img.ok{opacity:1}
.ph .noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;opacity:.35}
.tag{position:absolute;top:8px;right:8px;background:var(--navy);color:#fff;font-size:.7rem;font-weight:800;padding:2px 10px;border-radius:20px;z-index:2}
.info{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;flex:1}
.nm{font-weight:700;font-size:.9rem;line-height:1.35;min-height:2.4em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.stars{color:var(--gold);font-size:.85rem;letter-spacing:1px;direction:ltr;text-align:right}
.stars i{font-style:normal;color:#cdd5e5}
.stars b{color:var(--muted);font-weight:600;font-size:.72rem;margin-right:5px;letter-spacing:0}
.price{font-family:var(--disp);font-weight:800;font-size:1.15rem;color:#b88700}
.price small{font-size:.7em}
.add{margin-top:6px;background:var(--primary);color:#fff;border-radius:10px;height:38px;font-weight:800;font-size:.88rem;display:flex;align-items:center;justify-content:center;gap:6px}
.add:active{background:var(--primary-d)}
.add svg{width:17px;height:17px;fill:#fff}
.empty{grid-column:1/-1;text-align:center;padding:40px 14px;color:var(--muted);background:#fff;border-radius:14px}
.empty .big{font-size:42px;display:block}
.empty a{display:inline-block;margin-top:12px;background:var(--green);color:#fff;font-weight:800;padding:10px 20px;border-radius:30px}
.skel{aspect-ratio:3/4;border-radius:14px;background:linear-gradient(90deg,#e8edf7,#f6f8fc,#e8edf7);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
.frow{display:flex;justify-content:space-between;font-weight:700;margin-top:8px;color:#0a2c61}.frow.sm{font-weight:500;font-size:.8rem;color:#5b6b8c}
#areaSel{width:100%;font:inherit;padding:12px;border:1.5px solid #c9d6ee;border-radius:12px;background:#fff;color:#0a2c61}
footer{margin-top:26px;background:var(--navy);color:#fff;text-align:center;padding:22px 12px}
footer .logo{font-size:1.8rem}

/* pages (detail, cart) */
.page{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.page.open{display:block}
.pbar{position:sticky;top:0;z-index:3;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 12px;font-family:var(--disp);font-weight:800;font-size:1.1rem}
.back{background:rgba(255,255,255,.15);color:#fff;width:38px;height:38px;border-radius:50%;font-size:1.2rem}
.dwrap{max-width:560px;margin:0 auto;padding-bottom:110px}
.dph{background:#fff;aspect-ratio:1/1;position:relative}
.dph img{width:100%;height:100%;object-fit:contain}
.dbody{background:#fff;margin-top:8px;padding:14px;border-radius:16px 16px 0 0}
.dcat{color:var(--muted);font-weight:700;font-size:.85rem}

.qrow{display:flex;align-items:center;gap:12px;margin:14px 0}

.dfoot{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(10,44,97,.12);z-index:5;display:flex;justify-content:center}
.dfoot button{width:100%;max-width:536px;height:50px;border-radius:14px;background:var(--gold);color:var(--navy);font-weight:800;font-size:1.05rem;font-family:var(--disp)}
/* cart */
.citem{display:flex;gap:10px;background:#fff;border-radius:14px;padding:10px;margin:8px 12px;align-items:center}
.citem .ci{width:68px;height:68px;border-radius:10px;background:#eef2fa;flex:0 0 68px;overflow:hidden}
.citem .ci img{width:100%;height:100%;object-fit:contain}
.citem .cm{flex:1;min-width:0}
.citem .cn{font-weight:700;font-size:.9rem;line-height:1.3}
.citem .cp{font-family:var(--disp);font-weight:800;color:#b88700}
.citem .qty button{width:34px;height:34px}
.citem .qty span{min-width:32px}
.rm{background:#fde8e8;color:#c62828;border-radius:10px;width:36px;height:36px;font-size:1rem;flex:0 0 36px}
.cform{background:#fff;border-radius:14px;margin:8px 12px;padding:14px}
.cform label{display:block;font-weight:700;font-size:.85rem;margin:8px 0 3px}
.cform input{width:100%;height:44px;border:1.5px solid var(--line);border-radius:10px;padding:0 12px;font-family:inherit;font-size:1rem;color:var(--navy)}
.tot{display:flex;justify-content:space-between;font-family:var(--disp);font-weight:800;font-size:1.2rem;margin:4px 0 10px}
.wa{width:100%;height:52px;border-radius:14px;background:var(--green);color:#fff;font-weight:800;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px}

.hint{display:none;color:#c62828;font-size:.85rem;font-weight:700;margin:6px 0}
.ce{text-align:center;padding:60px 20px;color:var(--muted)}
.ce .big{font-size:54px;display:block}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 18px;border-radius:30px;font-weight:700;font-size:.9rem;z-index:80;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1}
.cartfloat{position:fixed;bottom:16px;right:14px;z-index:20;width:54px;height:54px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28);border:0}
.cartfloat svg{width:28px;height:28px;fill:#fff}.cartfloat .badge{top:-4px;left:-4px;right:auto}
.deal{margin:8px 12px;max-width:876px;background:linear-gradient(120deg,var(--navy),var(--primary));color:#fff;border-radius:16px;padding:10px;display:none;gap:12px;align-items:center;cursor:pointer}
.deal .dimg{width:84px;height:84px;border-radius:12px;background:#fff;flex:none;overflow:hidden}.deal .dimg img{width:100%;height:100%;object-fit:contain}

.deal button{background:var(--gold);color:var(--navy);font-weight:800;border-radius:10px;padding:8px 12px;flex:none}

.sent div{background:#fff;border-radius:20px;padding:22px;text-align:center;max-width:340px;width:100%}.sent h3{font-family:var(--disp);color:var(--navy);font-size:1.25rem;margin-bottom:8px}.sent p{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.sent button{width:100%;padding:12px;border-radius:12px;font-weight:800;margin-top:8px;background:#e8eefb;color:var(--navy)}.sent button.pri{background:var(--green);color:#fff}
.wafloat{position:fixed;bottom:16px;left:14px;z-index:20;width:54px;height:54px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.28)}
.wafloat svg{width:30px;height:30px;fill:#fff}

.stores{padding:8px 12px}.stores h2{font-family:var(--disp);font-size:1.05rem;margin-bottom:6px}.storetrack{display:flex;gap:12px;overflow-x:auto;padding:4px 0 8px}.store{flex:0 0 78px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:.72rem;font-weight:700;color:var(--navy);background:transparent;border:0}.storeicon{width:58px;height:58px;border:2px solid #d3e1f5;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;overflow:hidden}.storeicon img{width:100%;height:100%;object-fit:cover}.store.sel .storeicon{border:3px solid var(--primary);box-shadow:0 0 0 3px #1976d219}.store.sel{color:var(--primary)}

#subchips[hidden]{display:none}#subchips{padding-top:0}#subchips .chip{font-size:13px;background:#f1f6ff}#subchips .chip.on{background:#0A2C61;color:#fff}.bundleparts{font-size:11px;line-height:1.7;white-space:normal;overflow-wrap:anywhere}.dealitem .dt{min-width:0}.dealitem{min-height:154px;height:auto}.dealitem .dn{white-space:normal;font-size:16px;line-height:1.6}.dealitem .dl{font-size:11px}.dealitem .dp{white-space:normal}.dealitem small{font-size:11px;color:#ffdf62}.cm .bundleparts{color:#667a9d;margin:4px 0}.dealtrack{align-items:stretch}.cardcounter{display:flex;direction:ltr;align-items:center;justify-content:space-between;margin-top:6px;height:38px;border:1.5px solid #cbdff7;border-radius:10px;background:#eef5ff;overflow:hidden;color:#0a2c61}.cardcounter button{width:42px;height:100%;font-size:22px;font-weight:800;background:#e1edff;color:#1265bd}.cardcounter span{font-weight:800}.priceunit{display:block;direction:ltr;text-align:right;font-family:'Estedad';font-size:11px;font-weight:600;color:#667a9d;line-height:1.7}.dprice .priceunit{display:inline;font-size:15px}.cartfloat.hasitems{width:auto;min-width:145px;border-radius:16px;gap:10px;padding:0 13px}.cartfloat.hasitems svg{width:25px;height:25px}#floatSummary{display:flex;flex-direction:column;align-items:flex-start;line-height:1.6;white-space:nowrap}#floatSummary[hidden]{display:none}#floatSummary small{font-size:9px;font-weight:500;color:#e0edff}#floatSummary b{font-family:'Estedad';font-size:13px}.orderref{padding:10px!important;margin:8px 0!important;background:#eef5ff!important;border:1px dashed #b1cff2;border-radius:12px!important;font-size:13px;color:#0a2c61}.orderref b{display:block;font-size:17px;letter-spacing:1px}.reviewsummary{font-size:12px;line-height:1.7;color:#0a2c61;margin:4px 0}.reviewsummary>span{color:#ba8900;font-size:16px}.reviewsummary small{color:#7486a3;font-size:10px}.customerreviews{margin:22px 0;border-top:1px solid #e0e8f6;padding-top:14px}.customerreviews h3{font-size:17px} /* Equal card tracks, independent of image proportions and optional fields. */
#grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:700px){#grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
#grid .card{min-width:0}
#grid .ph{aspect-ratio:1/1;flex:none;overflow:hidden;background:#fff}
#grid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
#grid .info{display:grid;grid-template-rows:40px 22px 26px 72px 38px;gap:3px;flex:none}
#grid .nm{min-height:0;height:40px;line-height:20px;overflow-wrap:anywhere}
#grid .cardmerchant{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#grid .cardmerchant>*{margin:0;line-height:22px}
#grid .cardreviews{overflow:hidden}
#grid .reviewsummary{margin:0;line-height:26px;white-space:nowrap}
#grid .price{display:grid;grid-template-rows:18px 32px 22px;line-height:32px;min-width:0}
#grid .price:before{content:'';grid-row:1;grid-column:1}
#grid .oldprice{grid-row:1;grid-column:1;line-height:18px}
#grid .currentprice{grid-row:2;grid-column:1;white-space:nowrap;font-size:clamp(13px,4vw,18px)}
#grid .priceunit{grid-row:3;grid-column:1;line-height:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#grid .add,#grid .cardcounter{margin:0;height:38px;min-height:38px;width:100%}

/* Keep cart text readable on the primary blue in every browser. */
#cartFloat{color:#fff;-webkit-text-fill-color:#fff}
#floatSummary,#floatSummary b,#floatSummary small{color:#fff;-webkit-text-fill-color:#fff}
#floatTotal{unicode-bidi:plaintext;font-variant-numeric:tabular-nums}
#cartFloat .badge{color:#0A2C61;-webkit-text-fill-color:#0A2C61;min-width:22px;width:auto;padding:0 5px;white-space:nowrap}

/* Compact shared rows: reserve optional space only when this grid uses it. */
#grid{--merchant-row:0px;--review-row:0px;--old-row:0px;--unit-row:0px}
#grid.has-card-merchants{--merchant-row:17px}
#grid.has-card-reviews{--review-row:22px}
#grid.has-card-discounts{--old-row:16px}
#grid.has-card-units{--unit-row:18px}
#grid .info{padding:7px 10px 9px;grid-template-rows:36px var(--merchant-row) var(--review-row) calc(27px + var(--old-row) + var(--unit-row)) 36px;gap:2px}
#grid .nm{height:36px;line-height:18px}
#grid .cardmerchant>*{font-size:10px;line-height:17px}
#grid .reviewsummary{font-size:11px;line-height:22px}
#grid .price{grid-template-rows:var(--old-row) 27px var(--unit-row);line-height:27px;overflow:hidden}
#grid .oldprice{line-height:16px;font-size:10px}

<script>
(function(){

window.__bcarIdx=0;window.__bcarTimer=null;window.__bcarN=0;
function getBanners(){if(window.SECTION_BANNERS&&SECTION_BANNERS.length)return SECTION_BANNERS.slice();if(window.SECTION_BANNER&&SECTION_BANNER.image)return [SECTION_BANNER];return []}
function valid(b){if(!b||!b.image||!b.title||b.enabled===false)return false;if(typeof badgeActive==='function'&&b.until&&!badgeActive(b.until))return false;return true}
function show(i){var n=window.__bcarN;if(!n)return;window.__bcarIdx=((i%n)+n)%n;
var t=document.querySelector('.bcartrack');if(t)t.style.transform='translateX(-'+(window.__bcarIdx*100)+'%)';
var ds=document.querySelectorAll('.bdots button');for(var j=0;j<ds.length;j++){ds[j].className=(window.__bcarIdx===j)?'on':''}}
function restart(){if(window.__bcarTimer)clearInterval(window.__bcarTimer);if(window.__bcarN>1){window.__bcarTimer=setInterval(function(){show(window.__bcarIdx+1)},7000)}}
window.renderSectionBanner=function(){
var el=$('sectionBanner');var list=getBanners().filter(valid);
if(!list.length){el.hidden=true;el.innerHTML='';return}
el.hidden=false;window.__bcarN=list.length;if(window.__bcarIdx>=list.length)window.__bcarIdx=0;
var h='<div class="bcarview"><div class="bcartrack">';
list.forEach(function(b){var m=MERCHANTS.find(function(x){return x.id===b.merchantId});
h+='<div class="bcarslide"><img class="bcarimg" src="'+esc(b.image)+'" alt="'+esc(b.title)+'">';

h+='<button type="button" data-m="'+esc(b.merchantId||'')+'">'+esc(b.buttonText||'تصفح القسم')+' ←</button></div></div>'});
h+='</div></div>';
if(list.length>1){h+='<div class="bdots">';for(var j=0;j<list.length;j++){h+='<button type="button" data-i="'+j+'" aria-label="إعلان '+(j+1)+'"></button>'}h+='</div>'}
el.innerHTML=h;
var view=el.querySelector('.bcarview');
var btns=el.querySelectorAll('.bcarinfo button');
btns.forEach(function(btn){btn.onclick=function(){var mid=this.getAttribute('data-m');if(mid){activeCat=mid;activeSub='';query='';$('q').value='';$('clr').style.display='none';renderChips();renderGrid();$('categoryTitle').scrollIntoView({behavior:'smooth',block:'start'})}}});

dots.forEach(function(d){d.onclick=function(){show(parseInt(this.getAttribute('data-i')));restart()}});
var sx=0;
view.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
view.addEventListener('touchend',function(e){var dx=sx-e.changedTouches[0].clientX;if(Math.abs(dx)>40){show(window.__bcarIdx+(dx>0?1:-1));restart()}},{passive:true});
show(window.__bcarIdx);restart()};

var __rb=false;
new MutationObserver(function(){if(__rb)return;var el=document.getElementById('sectionBanner');if(el&&!el.hidden&&!el.querySelector('.bcarview')){__rb=true;renderSectionBanner();__rb=false}}).observe(document.getElementById('sectionBanner'),{childList:true});
})();
</script>
